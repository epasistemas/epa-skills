name: Validate skills

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fork-manual-validation-required:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Fork PR — validação automatizada não executada
        run: |
          echo "::error::PR de fork: por segurança, não rodamos scripts do contribuidor na CI."
          echo "Revisor deve executar localmente: ./scripts/pre_push.sh"
          echo "Skipped validate NÃO conta como aprovado."
          exit 1

  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skills layout
        run: python3 scripts/validate_skills.py

      - name: Policy scan (privacy + secrets, redacted output)
        run: python3 scripts/scan_policy.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q
